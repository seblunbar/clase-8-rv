<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juego: Atrapa la Esfera — A-Frame</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  
  <script>
    // ==================================================================
    // CAMBIOS:
    // - Se cambió la cantidad de estrellas del fondo para ser mayor
    // - Potencia de la luz inicial se pasó de 0.9 a 1.0
    // - El tiempo se cambió para ser 120 segundos
    // - Los puntos ahora valen 2.
    // - Dar click en un obstáculo divide los puntos totales entre 2.
    // - Se agregó la entidad tetrahedro.
    // ==================================================================

    
    // ==================================================================
    // FUNCIONES PRINCIPALES
    // ==================================================================
    function reproducirBeep(frecuencia) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = frecuencia;
      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
    }

    function vibrarControl(evento) {
      const cursorEl = evento.detail && evento.detail.cursorEl;
      if (!cursorEl) return;
      const trackedControls = cursorEl.components['tracked-controls'];
      const gamepad = trackedControls && trackedControls.controller;
      if (gamepad && gamepad.hapticActuators && gamepad.hapticActuators[0]) {
        gamepad.hapticActuators[0].pulse(0.7, 100);
      }
    }

    // ==================================================================
    // ESTRELLAS
    // ==================================================================
    AFRAME.registerComponent('campo-estrellas', {
      schema: { cantidad: { type: 'number', default: 160 } },
      init: function () {
        for (let i = 0; i < this.data.cantidad; i++) {
          const radio = 40;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos((Math.random() * 2) - 1);
          const x = radio * Math.sin(phi) * Math.cos(theta);
          const y = radio * Math.sin(phi) * Math.sin(theta);
          const z = radio * Math.cos(phi);

          const estrella = document.createElement('a-sphere');
          estrella.setAttribute('radius', 0.04 + Math.random() * 0.05);
          estrella.setAttribute('position', `${x} ${y} ${z}`);
          estrella.setAttribute('material', 'shader: flat; color: #FFFFFF');
          this.el.appendChild(estrella);
        }
      }
    });

    // ==================================================================
    // objetivo (SUMA PUNTOS)
    // ==================================================================
    AFRAME.registerComponent('objetivo', {
      init: function () {
        this.reubicar();

        this.el.addEventListener('click', (evento) => {
          const gestorEl = document.querySelector('#gestor-juego');
          if (!gestorEl) return;
          const gestor = gestorEl.components['gestor-juego'];
          if (!gestor || !gestor.jugando) return;

          reproducirBeep(660);
          vibrarControl(evento);
          this.el.sceneEl.emit('punto-anotado');
          this.reubicar();
        });
      },

      reubicar: function () {
        const angulo = Math.random() * Math.PI * 2;
        const distancia = 2 + Math.random() * 1.5;
        const altura = 1 + Math.random() * 1;
        const x = distancia * Math.cos(angulo);
        const z = distancia * Math.sin(angulo);
        this.el.setAttribute('position', `${x} ${altura} ${z}`);
      }
    });

    // ==================================================================
    // obstaculo (RESTA PUNTOS)
    // ==================================================================
    AFRAME.registerComponent('obstaculo', {
      init: function () {
        this.reubicar();

        this.el.addEventListener('click', (evento) => {
          const gestorEl = document.querySelector('#gestor-juego');
          if (!gestorEl) return;
          const gestor = gestorEl.components['gestor-juego'];
          if (!gestor || !gestor.jugando) return;

          reproducirBeep(180);
          vibrarControl(evento);
          this.el.sceneEl.emit('punto-restado');
          this.reubicar();
        });
      },

      reubicar: function () {
        const angulo = Math.random() * Math.PI * 2;
        const distancia = 2 + Math.random() * 1.5;
        const altura = 1 + Math.random() * 1;
        const x = distancia * Math.cos(angulo);
        const z = distancia * Math.sin(angulo);
        this.el.setAttribute('position', `${x} ${altura} ${z}`);
      }
    });

    // ==================================================================
    // gestor-juego (Control de tiempo y puntaje)
    // ==================================================================
    AFRAME.registerComponent('gestor-juego', {
      init: function () {
        this.puntos = 0;
        this.segundosRestantes = 120;
        this.jugando = true;
        this.temporizador = null;

        this.hudPuntos = document.querySelector('#hud-puntos');
        this.hudTiempo = document.querySelector('#hud-tiempo');
        this.hudFinal = document.querySelector('#hud-final');
        this.botonReiniciar = document.querySelector('#boton-reiniciar');

        this.el.sceneEl.addEventListener('punto-anotado', () => this.sumarPunto());
        this.el.sceneEl.addEventListener('punto-restado', () => this.restarPunto());
        this.botonReiniciar.addEventListener('click', () => this.reiniciar());

        this.iniciarCronometro();
      },

      iniciarCronometro: function () {
        // Garantizamos limpiar cualquier intervalo previo antes de iniciar uno nuevo
        if (this.temporizador) clearInterval(this.temporizador);

        this.hudTiempo.setAttribute('value', `Tiempo: ${this.segundosRestantes}`);

        this.temporizador = setInterval(() => {
          if (!this.jugando) return;

          this.segundosRestantes--;
          this.hudTiempo.setAttribute('value', `Tiempo: ${this.segundosRestantes}`);

          if (this.segundosRestantes <= 0) {
            this.terminarJuego();
          }
        }, 1000);
      },

      sumarPunto: function () {
        if (!this.jugando) return;
        this.puntos += 2;
        this.hudPuntos.setAttribute('value', `Puntos: ${this.puntos}`);
      },

      restarPunto: function () {
        if (!this.jugando) return;
        this.puntos = Math.trunc(this.puntos / 2);
        if (this.puntos < 0) this.puntos = 0;
        this.hudPuntos.setAttribute('value', `Puntos: ${this.puntos}`);
      },

      terminarJuego: function () {
        this.jugando = false;
        if (this.temporizador) clearInterval(this.temporizador);
        this.hudFinal.setAttribute('value', `¡Tiempo! Puntuacion final: ${this.puntos}`);
        this.hudFinal.setAttribute('visible', true);
        this.botonReiniciar.setAttribute('visible', true);
      },

      reiniciar: function () {
        this.puntos = 0;
        this.segundosRestantes = 120;
        this.jugando = true;

        this.hudPuntos.setAttribute('value', 'Puntos: 0');
        this.hudTiempo.setAttribute('value', 'Tiempo: 120');
        this.hudFinal.setAttribute('visible', false);
        this.botonReiniciar.setAttribute('visible', false);

        // Reubica todos los objetivos y obstáculos registrados
        const objetivos = document.querySelectorAll('.objetivo');
        objetivos.forEach(el => {
          if (el.components.objetivo) el.components.objetivo.reubicar();
        });

        const obstaculos = document.querySelectorAll('.obstaculo');
        obstaculos.forEach(el => {
          if (el.components.obstaculo) el.components.obstaculo.reubicar();
        });

        this.iniciarCronometro();
      }
    });
  </script>
</head>

<body>
  <a-scene campo-estrellas="cantidad: 100">

    <a-sky color="#00010D"></a-sky>

    <a-entity light="type: ambient; color: #55557A; intensity: 1.0"></a-entity>
    <a-entity light="type: point; color: #FFFFFF; intensity: 0.8; distance: 20" position="0 2.5 0"></a-entity>

    <a-entity id="gestor-juego" gestor-juego></a-entity>

    <!-- OBJETIVOS (SUMAN PUNTOS) -->
    <a-sphere class="clickable objetivo" objetivo radius="0.28" material="shader: flat; color: #02FF88"
              animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 500"></a-sphere>

    <a-box class="clickable objetivo" objetivo depth="0.4" height="0.4" width="0.4"
           material="shader: flat; color: #FFB703"
           animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 500"></a-box>

    <a-cone class="clickable objetivo" objetivo radius-bottom="0.3" radius-top="0" height="0.6"
            material="shader: flat; color: #FB5607"
            animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 500"></a-cone>

    <a-cylinder class="clickable objetivo" objetivo radius="0.25" height="0.5"
                material="shader: flat; color: #8338EC"
                animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 500"></a-cylinder>

    <a-torus class="clickable objetivo" objetivo radius="0.28" radius-tubular="0.06"
             material="shader: flat; color: #FFFA6E"
             animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"></a-torus>

    <a-tetrahedron class="clickable objetivo" objetivo radius="0.35"
                   material="shader: flat; color: #06D6A0"
                   animation="property: rotation; to: 360 360 0; loop: true; dur: 4000"></a-tetrahedron>

    <!-- OBSTÁCULOS (RESTAN PUNTOS) -->
    <a-sphere class="clickable obstaculo" obstaculo radius="0.28" material="shader: flat; color: #FF0000"
              animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 300"></a-sphere>

    <a-box class="clickable obstaculo" obstaculo depth="0.3" height="0.3" width="0.3"
           material="shader: flat; color: #FF0000"
           animation="property: rotation; to: 0 360 0; loop: true; dur: 2500"></a-box>

    <!-- Botón Reiniciar -->
    <a-entity id="boton-reiniciar" class="clickable"
              geometry="primitive: plane; width: 0.9; height: 0.35"
              material="color: #4CC3D9" position="0 1.6 -2.2" visible="false">
      <a-text value="Reiniciar" align="center" position="0 0 0.01" color="#000000" width="3"></a-text>
    </a-entity>

    <!-- JUGADOR + HUD -->
    <a-entity id="rig" position="0 0 0">
      <a-entity camera look-controls wasd-controls position="0 1.6 0">
        <a-cursor raycaster="objects: .clickable" color="#FFFFFF"></a-cursor>

        <a-text id="hud-puntos" value="Puntos: 0" position="-0.9 0.6 -1.4" width="2.2" color="#FFFFFF"></a-text>
        <a-text id="hud-tiempo" value="Tiempo: 120" position="0.4 0.6 -1.4" width="2.2" color="#FFFFFF"></a-text>
        <a-text id="hud-final" value="" position="-0.9 0.15 -1.4" width="2.6" color="#FFD166" visible="false"></a-text>
      </a-entity>

      <a-entity laser-controls="hand: left" raycaster="objects: .clickable"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
